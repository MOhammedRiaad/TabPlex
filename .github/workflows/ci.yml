name: CI

on:
    pull_request:
    push:
        branches-ignore: [main] # main is covered by the release workflow

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    verify:
        runs-on: ubuntu-latest
        env:
            HUSKY: 0
        steps:
            - uses: actions/checkout@v6

            - uses: actions/setup-node@v6
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci
            - run: npm run typecheck
            - run: npm run lint
            - run: npm run format:check

            - name: Unit tests (85% coverage gate)
              run: npm run test:coverage

            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: coverage-${{ github.sha }}
                  path: coverage/
                  retention-days: 14

            - run: npm run build
            - run: npm run check:bundle # startup chunks stay under 500 kB

            - name: Package (artifact for testing)
              run: node scripts/package-extension.mjs

            - uses: actions/upload-artifact@v4
              with:
                  name: tabplex-${{ github.sha }}
                  path: release/*.zip
                  retention-days: 14

    e2e:
        runs-on: ubuntu-latest
        env:
            HUSKY: 0
        steps:
            - uses: actions/checkout@v6

            - uses: actions/setup-node@v6
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci
            - run: npm run build
            - run: npx playwright install --with-deps chromium

            - name: End-to-end tests (real extension in Chromium)
              run: npm run test:e2e

            - uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: playwright-report-${{ github.sha }}
                  path: |
                      playwright-report/
                      test-results/
                  retention-days: 14
