name: CI

on:
    pull_request:
    push:
        branches-ignore: [main] # main is covered by the release workflow

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    verify:
        runs-on: ubuntu-latest
        env:
            HUSKY: 0
        steps:
            - uses: actions/checkout@v6

            - uses: actions/setup-node@v6
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci
            - run: npm run lint
            - run: npm run format:check
            - run: npm run build

            - name: Package (artifact for testing)
              run: node scripts/package-extension.mjs

            - uses: actions/upload-artifact@v4
              with:
                  name: tabplex-${{ github.sha }}
                  path: release/*.zip
                  retention-days: 14
